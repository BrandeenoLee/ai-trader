drop on an earnings miss that partly reflects SpaceX, but it's the first session, so there's no green-close confirmation. The story is also mixed with AI capex and search worries. CAT's drop is a fresh structural downtrend.", "orders": [], "cost": 0.01394, "usage": {"input_tokens": 5071, "output_tokens": 380}}, {"ts": "2026-10-29T18:55:47+00:00", "kind": "decision", "strategy": "D", "slot": "slot 1, check-in level 3/day", "summary": "Hold: the 3\u201315% band is empty again. Of the liquid 15\u201340% names, only ADT (+34%, 0.10% spread, $49.6M volume) and NCPL (+49%, 0.61% spread) pass the screen. Both are day-1 spikes, so they go on the watchlist for a day-2 setup. VRTL from yesterday isn't in today's list, so there's no follow-through I can check.", "orders": [], "cost": 0.00991, "usage": {"input_tokens": 3916, "output_tokens": 208}}, {"ts": "2026-10-29T18:55:54+00:00", "kind": "decision", "strategy": "E", "slot": "slot 1, check-in level 1/day", "summary": "QQQ is at its 75% position cap and cash is about 25%, so I'm putting the excess into SPY. I'm skipping the extended single-stock leaders.", "orders": [{"action": "buy", "symbol": "SPY", "amount_usd": 97, "limit_price": 768.9, "confidence": 5, "reasoning": "QQQ is at its 75% cap, so I'm sweeping the excess cash into SPY, an allowed ETF, to cut cash drag. That leaves about 5% cash.", "result": "placed buy 0.1261 @ 768.9"}], "cost": 0.01495, "usage": {"input_tokens": 4065, "output_tokens": 682}}, {"ts": "2026-10-30T18:31:58+00:00", "kind": "fill", "strategy": "E", "symbol": "SPY", "order_id": "c48bac05-807f-4349-b18e-f0482869eebf", "fill_price": 767.618, "side": "buy", "qty": 0.1261, "eff_price": 768.001809, "cost": 96.84502811489999}, {"ts": "2026-10-30T18:32:10+00:00", "kind": "decision", "strategy": "A", "slot": "slot 1, check-in level 2/day", "summary": "PLTR hit the early-warning stop zone (-7.0%) on a weak market day, so I'm selling it. V and XLE stay, with no stop triggered on either.", "orders": [{"action": "sell", "symbol": "PLTR", "sell_fraction": 1, "limit_price": 183.0, "confidence": 5, "reasoning": "PLTR is 7.0% below entry, past the 6% early-warning level, and it isn't among the 20d leaders. It is about 1% above the -8% hard stop on a -2.4% SPY day. I'm cutting it under the stop rules.", "result": "placed sell 0.8312 @ 183.0"}], "cost": 0.01327, "usage": {"input_tokens": 3488, "output_tokens": 629}}, {"ts": "2026-10-30T18:32:13+00:00", "kind": "decision", "strategy": "B", "slot": "slot 1, check-in level 3/day", "summary": "Exit NVDA per the stop rule and stay in cash while the broad selloff is still active, with no stabilization yet.", "orders": [{"action": "sell", "symbol": "NVDA", "sell_fraction": 1, "limit_price": 200.5, "confidence": 7, "reasoning": "NVDA is -8.8%, well below the ~210 stop, and past the 10/29 time stop. The notes say to follow the stop with no exceptions. Today's selloff (QQQ -4.3%) is still active.", "result": "placed sell 0.3167 @ 200.5"}], "cost": 0.01086, "usage": {"input_tokens": 3532, "output_tokens": 380}}, {"ts": "2026-10-30T18:32:15+00:00", "kind": "decision", "strategy": "C", "slot": "slot 1, check-in level 3/day", "summary": "Holding cash: the best setup is Intel's 31% drop after a factory blast, but it's the first session with no green-close confirmation and the damage is hard to size. The chip selloff is sector-wide and still adding bad news.", "orders": [], "cost": 0.01164, "usage": {"input_tokens": 5102, "output_tokens": 144}}, {"ts": "2026-10-30T18:32:22+00:00", "kind": "decision", "strategy": "D", "slot": "slot 1, check-in level 3/day", "summary": "Hold: the 3\u201315% band is empty again. SPY fell 2.4% today, so the \u00b130% movers look like market-stress noise, such as leveraged ETFs (SOXS, UVIX).", "orders": [], "cost": 0.00937, "usage": {"input_tokens": 3993, "output_tokens": 138}}, {"ts": "2026-10-30T18:32:24+00:00", "kind": "decision", "strategy": "E", "slot": "slot 1, check-in level 1/day", "summary": "Hold: QQQ is 5% below entry, so the 10% stop is not hit. Cash is about 5%, there are no single-stock positions or earnings risk, and I'm not buying into the sharp drop.", "orders": [], "cost": 0.01019, "usage": {"input_tokens": 4069, "output_tokens": 205}}, {"ts": "2026-10-31T00:52:10+00:00", "kind": "fill", "strategy": "A", "symbol": "PLTR", "order_id": "5b5a7f8e-5ed1-4ff3-b02b-88adc81b0679", "fill_price": 184.16, "side": "sell", "qty": 0.8312, "eff_price": 183.23036032, "proceeds": 152.301075497984, "pnl": -12.422016502016021}, {"ts": "2026-10-31T00:52:10+00:00", "kind": "fill", "strategy": "B", "symbol": "NVDA", "order_id": "163a1818-1b58-4682-8ab6-5a8166d85df5", "fill_price": 201.434, "side": "sell", "qty": 0.3167, "eff_price": 201.333283, "proceeds": 63.76225072609999, "pnl": -6.176625273900001}, {"ts": "2026-10-31T00:52:26+00:00", "kind": "review", "strategy": "A", "lessons": "The early-warning stop worked: PLTR was cut at -7.5% (-$12.42) on a -2.4% SPY day, before the hard stop. But treating PLTR as the \"core\" holding meant high-beta tech kept dragging returns, and the strategy is now down 7.4 points vs SPY since start. XLE is a sensible non-tech, low-spread momentum holding. Confidence 5-7 trades keep losing across the tournament, so confidence is now fixed at 5. The notes also push toward ETFs and low-beta leaders and limit tech to one name.", "self_assessment": "Lost 2.02% vs SPY's -0.54%. Cut PLTR under the stop rules and now holding V and XLE. Shifting toward low-beta, non-tech leaders and ETFs.", "confidence_beat_spy": 3, "cost": 0.0458}, {"ts": "2026-10-31T00:52:42+00:00", "kind": "review", "strategy": "B", "lessons": "Staying in cash during the selloff was the right call. The main mistake was not acting on NVDA's 10/29 time stop. We held it at -3.6%, it gapped to -8.8% the next day, and we sold for -$6.18. That loss was about twice what an on-time exit would have cost. Exits now have exact prices and dates written down and get checked first, and time stops are executed on the day itself. The confidence data still shows higher confidence doing worse, so the cap on buys stays at 5.", "self_assessment": "B: -0.65% this week (SPY -0.54%). Exited NVDA late after missing the time stop. Now all cash and still +2.8 points ahead of SPY since start.", "confidence_beat_spy": 5, "cost": 0.04404}, {"ts": "2026-10-31T00:52:58+00:00", "kind": "review", "strategy": "C", "lessons": "Holding cash again beat a falling SPY, and avoiding Boeing (no explaining headline) and Xylem/CAT (real damage) was sound. The flaw: the green-close rule got cited every day, but the names flagged the day before (GOOGL, BA) were never rechecked, so the rule only ever worked as a reason to wait. Added a watchlist carry-forward step so a confirmed bounce can actually turn into a starter. Tournament data still shows mid- and high-confidence buys doing worst, so starters stay at confidence 3\u20135.", "self_assessment": "Flat week (\u22120.02%) while SPY fell 0.54%: all cash, which was safe, but the strategy made zero catalyst trades for the second week running.", "confidence_beat_spy": 4, "cost": 0.04455}, {"ts": "2026-10-31T00:53:18+00:00", "kind": "review", "strategy": "D", "lessons": "Fifth straight week with no trades. Sitting in cash kept us about 2.4 points ahead of SPY, but that's beta avoidance, not skill. The day-2 watchlist rule never fired because spike names drop out of the next day's data. So I added a narrow day-1 starter tier (very liquid, tight spread, closing strong, smallest size), told the trader to drop watchlist names that aren't visible, and banned leveraged ETFs and buying on days SPY falls 2% or more. Tournament data still shows higher-confidence buys doing worse, so confidence stays at 3 by default.", "self_assessment": "Flat (-0.02%) in cash vs SPY -0.54%. Fifth week without a trade, so I added a narrow, small-size day-1 entry rule for very liquid movers.", "confidence_beat_spy": 5, "cost": 0.04661}, {"ts": "2026-10-31T00:53:35+00:00", "kind": "review", "strategy": "E", "lessons": "Getting out of MSFT before earnings and sweeping cash into the index ETFs worked as intended, and it avoided a repeat of the META earnings hit. The week's underperformance came from QQQ's higher beta in a tech-led drop, plus cash that sat idle while sales settled. Spreads have now cost about 0.16%, and small trades like the $2 QQQ buy add cost for no benefit. High-confidence buys did no better than low-confidence ones, so confidence should never set the size.", "self_assessment": "Lost 2.03% vs SPY's -0.54% because QQQ's higher beta hurt in the tech selloff; now holding QQQ and SPY with fewer trades and no QQQ stop to avoid selling into dips.", "confidence_beat_spy": 4, "cost": 0.04653}], "spend": {"2026-10": {"by_strategy": {"A": 0.357738, "B": 0.34969, "C": 0.4073, "D": 0.343062, "E": 0.45614}, "calls": 106, "total": 1.91393}}, "budget": {"target": 5.0, "cap": 20.0}, "notes": {"A": "# Strategy A notes: Momentum\n\n## Entry rules\n- Buy names with positive 20-day AND 60-day returns that trade above their 50-day average.\n- Rank by 60d trend first, then 20d. No holding is \"core\". Every position follows the same rules. Calling PLTR core led to holding it from entry down to -7.5% (-$12.42).\n- Skip any name with a single-day spike of more than 5%.\n- A name more than 15% above its 50d average is extended. Skip it. Extended AMD lost 14% in a week.\n- Hold at most 1 name from the high-beta tech/semis cluster. Those names have caused the biggest losses (AMD, META, PLTR).\n- Prefer sector ETFs (XLE, XLV, XLI, XLF) or large low-beta leaders (V, MA). Spreads and volatility are lower, and that suits a $500 account.\n- Don't buy a name that overlaps a current holding (e.g. CVX or XOM while holding XLE).\n\n## Sizing\n- Hold 2-4 positions, keeping $15-25 in cash.\n- Use confidence 5 for every trade. Never go above 5. Tournament data: 1-4 averaged +0.75% (n=3), 5-7 averaged -5.11% (n=10), 8-10 averaged -3.90% (n=2). Higher conviction has not produced better returns.\n\n## Exits and rotation\n- Hard stop: sell any position that closes 8% or more below entry.\n- Early warning: log every holding's % from entry each day. Sell at -6% or worse if the name is also below its 50d average, has a negative 20d return, or has dropped out of the 20d leaders. This worked on PLTR: it exited before -8%.\n- Rotate out when a holding closes below its 50d average, or when its 20d return turns negative and it drops out of the top names.\n- Hold at least 3 trading days unless a stop triggers.\n- Spread penalties have reached $3.97, which is nearly 1% of capital. Make at most one trade per day. Only rotate into a clearly higher-ranked name.\n- Don't take profits just because a position is up.\n\n## Execution\n- Place limit orders near the current quote and check every fill against its limit. The XLE fill (69.69 vs a 69.85 limit) came in on the right side.\n\n## Status\n- Week: -2.02% vs SPY -0.54%. Since start: -9.93% vs SPY -2.51%.\n- Holding V and XLE. About $152 of PLTR proceeds is settling. Once it settles, put about $125-135 into ONE top-ranked, non-extended leader from a sector we don't hold yet (health care, industrials or financials; an ETF is preferred). Don't add tech. Apply the stop rules from each entry price.\n", "B": "# Strategy B notes: Mean reversion\n\n## Entry setup (core, unchanged)\n- Look for liquid names with a sharp 5-day drop of about 2x their normal 5-day move or more, while the 60-day trend is still intact and price is near or above its 50d MA.\n- Skip drops caused by clear bad news: earnings misses, guidance cuts, or sector-wide shocks.\n- If a drop has no explanation, check for news. If none turns up and the trend is intact, take a small position.\n- During an active broad selloff (e.g. QQQ -4% days), wait until it stabilizes: one up day, or the 5-day drop stops getting worse. Then make one small entry instead of trying to catch every falling name.\n\n## Deploying cash\n- We are 100% cash after a broad selloff. That has protected the lead (+0.28% vs SPY -2.51%), but cash can't beat SPY in a rebound.\n- After the first stabilization day, scan for the best 1-2 intact-trend dips. Prefer non-tech sectors (financials, healthcare, staples, industrials, energy). Rank the candidates and buy the best one rather than rejecting each one for being imperfect.\n- Target 2-4 positions from different sectors, with about 40-60% of the account invested when setups exist. Build up over several days, not all at once.\n\n## Costs and orders\n- Spread costs total $3.87 (~0.77% of the account). Trade large, tight-spread names only. Each position should be \u2265 ~$70. Skip a trade if the expected bounce is under ~3%.\n- Place limits near the current price. Buys have filled 1-3% worse than the limit, so size for that.\n\n## Exits (enforce mechanically)\n- At each entry, write down the exact stop price, take-profit price and time-stop date. Check all three at the start of every decision.\n- Time stop: on the time-stop date, sell that day. Don't wait for the next day. NVDA passed its 10/29 time stop at about -3.6% and was held. The next day it gapped to -8.8%, and we sold at 201.33 (-$6.18). Exiting on time would have saved about $3.\n- Stop: if price closes at or below the stop, or is within ~1% of it on a down-market day, exit.\n- Defaults: take profit near the pre-drop level (~+5%). Cut at -5%, or right away on bad news. Exit after ~10 trading days with no bounce. Following these rules gave CRM +5.8% and TSLA +5.3%.\n\n## Confidence\n- Tournament data: conf 1-4 averaged +0.75% (3 buys), conf 5-7 averaged -5.11% (10), and conf 8-10 averaged -3.90% (2). Higher stated confidence keeps doing worse.\n- Default dip buys to conf 3-4. Use 5 only for a textbook setup after stabilization with a clean news check. Never go above 5 on buys.\n", "C": "# Strategy C notes: Catalyst reader\n\n## Identity\nTrade only when a specific headline explains a price move, or explains why a stock didn't move. Look for over- and under-reactions. Holding cash is allowed. Most of the lead over SPY so far comes from holding cash in falling weeks (W2\u2013W4). That isn't catalyst skill, and it will lag in a rising week.\n\n## Entry rules\n- Each session, name the single best catalyst setup and give it a verdict: (a) what the news changes over 12 months, (b) whether the move is bigger than that, (c) buy, or hold with a specific reason.\n- **Watchlist carry-forward (new):** keep a list of every overreaction you flagged but skipped as \"first session\" or \"no green close\". At the start of each session, check each name first. Did it close green, or hold above the prior low for a full session? If so, and the thesis is unchanged, take a small starter. In W4, GOOGL and INTC were flagged on day 1 and never revisited, so the confirmation rule was only ever used as a reason to wait.\n- **Overreaction (>5% move on specific news):** buy only after a green close, or a full session holding above the prior low. An intraday bounce doesn't count.\n- **No headline, no trade:** a big drop with no explaining headline (W4: BA) is not a catalyst setup. Skip it.\n- **Underreaction:** concrete material news with less than a 1% move. Write down one candidate every session, even in selloffs. This is the main way to make money in up weeks.\n- Prefer single-company catalysts. If a sector or macro selloff keeps adding new bad news, stay out.\n- Don't buy into a fresh structural downtrend or real fundamental damage (NFLX W3, XYL guidance cut W4).\n\n## Data hygiene\n- If every price shows 0.0%, treat the data as stale and hold. Say so.\n\n## Sizing and confidence\n- Tournament results by stated confidence: 1\u20134 avg +0.75% (n=3), 5\u20137 avg \u22125.11% (n=10), 8\u201310 avg \u22123.90% (n=2). Higher confidence has not meant better results.\n- Starters use confidence 3\u20135 and stay small. Add only after a further confirmed up close. Never use 8+.\n- Hold at most 2 positions.\n\n## Exits\n- **Time stop:** if the position isn't up within 3 sessions of the fill, exit on the next decision.\n- **Thesis break:** if new negative news widens the story, exit or cut by half.\n- **Take profit** once about half the overreaction has retraced.\n\n## Log\n- W1: 0 trades, \u22120.01% vs SPY +0.68%.\n- W2: \u22120.83% vs SPY \u22121.96%. Bought SMH too early.\n- W3: +0.30% vs SPY \u22120.42%. SMH time-stop exit \u22122.8%, then cash.\n- W4: \u22120.02% vs SPY \u22120.54%. 0 trades. All holds were reasonable one at a time, but flagged names never got a follow-up check.\n", "D": "# Strategy D notes: Small-cap explorer\n\nIdentity: find tradable small-cap opportunities that SPY doesn't capture. Record: zero trades in 5 weeks. We're at -0.06% since start and SPY is at -2.51%. That gap comes from sitting in cash while SPY fell. It is not edge. Cash is still an acceptable default, but the day-2 watchlist rule never fired, because spike names fall off the mover list the next day and day 2 can't be checked.\n\n## What the data looks like\n- The mover list shows extremes: \u00b125% or more, warrants, illiquid names, and leveraged ETFs on stress days. The 3\u201315% band has been empty for 3 weeks. If it's empty, say so in one line.\n- Ignore leveraged or inverse ETFs (SOXS, UVIX and similar). They aren't small caps.\n\n## Screening\n- Drop warrants, units, rights, anything under $0.50, volume under $1M, spreads over 1.5%, and moves of \u00b140% or more. Don't comment on them.\n- Tier 1: names moving \u00b13\u201315% with a spread of 1.5% or less and real volume.\n- Tier 2 (watchlist): liquid names moving 15\u201340%. The next session, buy only on day-2 continuation (holds above the prior midpoint and volume stays up) or a 30\u201350% pullback that stabilizes. If the name isn't in the next day's data, write \"not visible, dropped\" and move on.\n- New Tier 3 (day-1 starter, max 1 per week): an up-move of 15\u201335% with spread \u22640.5%, volume \u2265$10M, and price in the upper third of the day's range. This is for news-driven, very liquid names like last week's ADT (+34%, 0.10% spread, $50M volume). Confidence 3, smallest size, stop just below the day's midpoint, target 2x risk, max hold 3 days.\n- Skip all new entries on days SPY is down 2% or more.\n\n## Entry and sizing\n- Confidence 3\u20134, max 2 names, limit order at or near the mid. Don't chase.\n- The expected move must be at least 3x the spread.\n\n## Exits\n- Set the stop and target before buying. Cut on a close below the stop. Don't hold through binary events.\n\n## Confidence\n- Tournament-wide: buys at 1\u20134 averaged +0.75% (n=3), 5\u20137 averaged -5.11% (n=10), 8\u201310 averaged -3.90% (n=2). Higher confidence has gone with worse results.\n- Default is 3. Use 5 only with a fresh catalyst, spread \u22641%, and a clean chart. Never use 6 or higher.\n", "E": "# Strategy E: Claude's pick: low-turnover QQQ/SPY core, rare single-stock leaders\n\n## Approach\nQQQ is a higher-beta tilt against SPY, held with very few trades. Losses so far came from single stocks held through earnings (META) and from trading costs ($0.82 in spreads, about 0.16% of $500). This week QQQ lagged SPY in a tech-led drop. That's normal noise for this tilt, so it isn't a reason to change the approach. **The edge comes from not trading.**\n\n## Current target (hold it)\n- QQQ about 70-75% (the cap is 75%) and SPY about 20-25%. Keep cash at 5% or less.\n- No single stocks while SPY is below its 50-day average.\n\n## Universe\n- QQQ and SPY first. XLK and SMH are allowed but are not needed.\n- Single stocks only when SPY is above its 50-day: US stocks over $10B market cap with average daily volume over $50M. The price must be above a rising 50-day average and the 50-day above the 200-day. Skip anything up more than 15% in 3 days.\n\n## Entry (single stocks)\n- At most 1 new single stock per week, sized 10-15%, funded from SPY rather than QQQ.\n- Never open a position within 5 trading days of its earnings date.\n- Limit price: last to +0.3%. If the order expires twice, drop the idea.\n\n## Earnings rule\n- Check every holding's next earnings date at each check-in. Two sessions before a report, cut the name to 10% or less, or sell it into SPY.\n\n## Exits (judged on verified prior closes)\n- Single stocks: sell on a close 8% below entry, or 2 closes more than 2% below the 50-day average.\n- QQQ: no price stop. Selling into a dip only locks in losses and pays spread. Rotate QQQ to SPY only if QQQ closes below its 200-day average.\n- Proceeds go to SPY or QQQ, whichever is under its target, at the same check-in.\n\n## Sizing and confidence\n- Confidence does not predict results. Tournament-wide, conf 1-4 buys averaged +0.75%, conf 5-7 averaged -5.1% and conf 8-10 averaged -3.9%. Use the smallest size in the allowed range; never size up on conviction.\n- Only sweep cash once it exceeds 8%. Don't make tiny trades (the $2 QQQ buy was a waste).\n\n## Habits\n- The default is HOLD. Aim for 0-1 trades per week. Log a confidence score and a one-line reason for each trade.\n"}};

document.getElementById('sub').textContent=`Started ${D.started} · last update ${last.date||'n/a'} · paper trading`;
// standings
{const spyEq=last[D.benchmark]||start;const rows=S.map(s=>({s,eq:last[s]??start})).sort((a,b)=>b.eq-a.eq);
let h='<tr><th>Strategy</th><th class="num">Net equity</th><th class="num">Total</th><th class="num">vs SPY</th><th class="num">Check-ins/day</th><th class="num">AI cost</th><th>Holdings</th></tr>';
for(const r of rows){const st=D.strategies[r.s];const hold=Object.entries(st.positions).map(([k,v])=>`${k} ${(+v.qty).toFixed(2)}`).join(', ')||'cash';
h+=`<tr><td><span class="dot" style="background:${COL[r.s]}"></span>${r.s} · ${esc(st.name)}</td><td class="num">$${r.eq.toFixed(2)}</td><td class="num">${pct((r.eq/start-1)*100)}</td><td class="num">${pct((r.eq/spyEq-1)*100)}</td><td class="num">${st.level}</td><td class="num">$${st.ai_cost.toFixed(2)}</td><td>${esc(hold)}</td></tr>`;}
h+=`<tr><td><span class="dot" style="background:${COL[D.benchmark]}"></span>${D.benchmark} buy &amp; hold</td><td class="num">$${spyEq.toFixed(2)}</td><td class="num">${pct((spyEq/start-1)*100)}</td><td></td><td></td><td></td><td>${D.benchmark}</td></tr>`;
document.getElementById('standings').innerHTML=h;}
// chart
{const keys=[...S,D.benchmark],E=D.equity;const el=document.getElementById('chart');
if(E.length<2){el.innerHTML='<div class="muted">The chart appears after two days of data.</div>';}else{
const W=1000,H=300,p={l:52,r:12,t:12,b:28};let lo=1e9,hi=-1e9;for(const r of E)for(const k of keys)if(r[k]!=null){lo=Math.min(lo,r[k]);hi=Math.max(hi,r[k]);}
const pad=(hi-lo)*.1||5;lo-=pad;hi+=pad;const x=i=>p.l+i*(W-p.l-p.r)/(E.length-1),y=v=>p.t+(hi-v)*(H-p.t-p.b)/(hi-lo);
let g='';for(let i=0;i<5;i++){const v=lo+i*(hi-lo)/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p.l-6}" y="${y(v)+4}" text-anchor="end">$${v.toFixed(0)}</text>`;}
const step=Math.ceil(E.length/8);E.forEach((r,i)=>{if(i%step===0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${r.date.slice(5)}</text>`;});
g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(start)}" y2="${y(start)}" stroke="var(--muted)" stroke-dasharray="3 4"/>`;
for(const k of keys){const pts=E.map((r,i)=>r[k]==null?null:`${x(i)},${y(r[k])}`).filter(Boolean).join(' ');
g+=`<polyline points="${pts}" fill="none" stroke="${COL[k]}" stroke-width="${k===D.benchmark?2.5:1.75}" ${k===D.benchmark?'stroke-dasharray="6 4"':''}/>`;}
el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Equity by strategy">${g}</svg>`;
document.getElementById('legend').innerHTML=keys.map(k=>`<span style="margin-right:14px"><span class="dot" style="background:${COL[k]}"></span>${k}</span>`).join('');}}
// weekly
{let h='<tr><th>Week ending</th>'+S.map(s=>`<th class="num">${s}</th>`).join('')+`<th class="num">${D.benchmark}</th><th>Notes</th></tr>`;
for(const w of [...D.weekly].reverse()){h+=`<tr><td>${w.date}</td>`+S.map(s=>`<td class="num">${pct(w.strategies[s]?.week_ret)}</td>`).join('')+`<td class="num">${pct(w.benchmark.week_ret)}</td><td class="muted">${esc(w.strategies.E?.self_assessment||'')}</td></tr>`;}
if(!D.weekly.length)h+='<tr><td colspan="8" class="muted">First recap arrives Friday after the close.</td></tr>';
document.getElementById('weekly').innerHTML=h;}
// confidence
{const lw=D.weekly[D.weekly.length-1];const c=lw?.confidence||{};let h='<tr><th>Confidence</th><th class="num">Filled buys</th><th class="num">Avg return</th></tr>';
for(const t of ['1-4','5-7','8-10']){const r=c[t];h+=`<tr><td>${t}</td><td class="num">${r?r.n:0}</td><td class="num">${r&&r.n?pct(r.avg):'n/a'}</td></tr>`;}
if(lw&&lw.e_confidence_log&&lw.e_confidence_log.length){h+=`<tr><td colspan="3" class="muted">Strategy E's weekly confidence it would beat SPY: ${lw.e_confidence_log.map(x=>`${x.week}: ${x.confidence}/10 → ${x.beat==null?'pending':(x.beat?'beat':'missed')}`).join(' · ')}</td></tr>`;}
document.getElementById('conf').innerHTML=h;}
// spend
{const m=Object.keys(D.spend).sort().pop();const cur=m?D.spend[m]:{total:0,calls:0,by_strategy:{}};
const kp=(v,l)=>`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
document.getElementById('spend').innerHTML=kp('$'+cur.total.toFixed(2),`spent in ${m||'this month'}`)+kp('$'+D.budget.target.toFixed(0),'monthly target')+kp('$'+D.budget.cap.toFixed(0),'hard cap')+kp(cur.calls,'AI calls');}
// log
{const tabs=document.getElementById('logtabs');let cur='all';const draw=()=>{const rows=D.journal.filter(r=>cur==='all'||r.strategy===cur).slice().reverse().slice(0,200);
let h='<tr><th>Time (UTC)</th><th>Strat</th><th>Event</th><th>Detail</th></tr>';
for(const r of rows){let d='';if(r.kind==='decision'){d=esc(r.summary)+(r.orders||[]).map(o=>`<div>• ${esc(o.action)} ${esc(o.symbol)} conf ${esc(o.confidence)}: ${esc(o.reasoning)} <span class="muted">→ ${esc(o.result)}</span></div>`).join('')||'<div class="muted">hold</div>';}
else if(r.kind==='fill'){d=`${r.side} ${(+r.qty).toFixed(4)} ${esc(r.symbol)} @ ${(+r.fill_price).toFixed(2)}`+(r.pnl!=null?` · P&L ${(+r.pnl).toFixed(2)}`:'');}
else if(r.kind==='review'){d=esc(r.lessons);}else{d=esc(r.status||r.error||r.note||'');}
h+=`<tr><td class="muted">${r.ts.slice(0,16).replace('T',' ')}</td><td>${r.strategy||''}</td><td>${r.kind}</td><td>${d}</td></tr>`;}
document.getElementById('log').innerHTML=h;tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));};
tabs.innerHTML=['all',...S].map(k=>`<button data-k="${k}">${k==='all'?'All':k}</button>`).join('');tabs.onclick=e=>{if(e.target.dataset.k){cur=e.target.dataset.k;draw();}};draw();}
// notes
{const tabs=document.getElementById('notetabs');let cur=S[0];const draw=()=>{document.getElementById('notes').textContent=D.notes[cur];tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));};
tabs.innerHTML=S.map(k=>`<button data-k="${k}">${k} · ${esc(D.strategies[k].name)}</button>`).join('');tabs.onclick=e=>{if(e.target.dataset.k){cur=e.target.dataset.k;draw();}};draw();}
</script></body></html>
