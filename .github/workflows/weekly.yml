name: Friday review

on:
  schedule:
    - cron: "17 21 * * 5"   # Friday 5:17pm EDT / 4:17pm EST, after the close
  workflow_dispatch:
    inputs:
      mode:
        description: "review = weekly review + email; design-e = have Claude design strategy E"
        type: choice
        options: [review, design-e]
        default: review

permissions:
  contents: write

concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Review
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ "${{ inputs.mode }}" = "design-e" ]; then
            python -m bot.review --design-e
          else
            python -m bot.review
          fi
      - name: Save state
        run: |
          git config user.name "tournament-bot"
          git config user.email "tournament-bot@users.noreply.github.com"
          git add state notes docs
          git diff --cached --quiet || git commit -m "Friday review $(date -u +'%Y-%m-%d')"
          git pull --rebase && git push
