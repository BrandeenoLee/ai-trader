name: Check-in

# Runs at each Eastern-time slot (9:45, 11:00, 12:30, 14:00, 15:30), scheduled in UTC for
# both daylight and standard time. The script works out which slot is due and skips
# duplicates, closed markets and holidays on its own.
on:
  schedule:
    - cron: "48 13,14 * * 1-5"   # 9:45 ET
    - cron: "3 15,16 * * 1-5"    # 11:00 ET
    - cron: "33 16,17 * * 1-5"   # 12:30 ET
    - cron: "3 18,19 * * 1-5"    # 14:00 ET
    - cron: "33 19,20 * * 1-5"   # 15:30 ET
  workflow_dispatch:
    inputs:
      force:
        description: "Run every strategy now, ignoring slots"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-state   # never two runs editing the ledger at once
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check-in
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot.checkin ${{ inputs.force && '--force' || '' }}
      - name: Save state
        run: |
          git config user.name "tournament-bot"
          git config user.email "tournament-bot@users.noreply.github.com"
          git add state notes docs
          git diff --cached --quiet || git commit -m "Check-in $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase && git push
