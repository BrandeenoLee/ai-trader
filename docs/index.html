ded junk sensibly but was too passive; the notes now push for a deeper screen and small starter positions.", "confidence_beat_spy": 3, "cost": 0.03063}, {"ts": "2026-10-09T21:42:32+00:00", "kind": "review", "strategy": "E", "lessons": "The loss came from not getting orders filled, not from bad picks. Three of four limit orders expired, so about 68% of the account sat in cash while SPY gained 0.68%. Bidding under the last price on a rising stock (MSFT) didn't work. Limits now go at or slightly above the last price, and an ETF cash sweep keeps the account invested. Confidence data is too thin to calibrate: only one fill, at conf 6.", "self_assessment": "Lagged SPY by about 0.7 pts because most of the account sat in cash after limit orders expired. Fixing fills and adding an ETF cash sweep.", "confidence_beat_spy": 4, "cost": 0.03991}, {"ts": "2026-10-10T00:58:06+00:00", "kind": "review", "strategy": "A", "lessons": "Putting money into the three top 60d/20d momentum names (PLTR, META, AMD) beat SPY for the week (+1.35% vs +0.68%), and holding afterwards instead of churning was right. Spread costs ($0.92) are still large compared with our edge, so trading should stay infrequent. Confidence (5-6) didn't separate winners from losers, so keep it conservative. A META buy filled above its limit and should be checked.", "self_assessment": "Momentum beat SPY this week (+1.35% vs +0.68%) by holding PLTR, META and AMD, but is still slightly behind since start (+0.33% vs +0.41%).", "confidence_beat_spy": 5, "cost": 0.03604}, {"ts": "2026-10-10T00:58:21+00:00", "kind": "review", "strategy": "B", "lessons": "Using only one small CRM starter and holding the rest in cash protected against losses but lagged SPY in an up week (+0.14% vs +0.68%). Skipping VZ/T after the sector news was reasonable, but INTC was deferred twice without a news check. The CRM fill came in above its buy limit, which should be impossible, so it needs to be flagged as an anomaly. Confidence data is still too thin to judge whether higher confidence leads to better trades.", "self_assessment": "Up 0.14% this week vs SPY's +0.68% because the account was mostly cash; next week aims for 2-4 qualifying dips with fixed CRM exit levels.", "confidence_beat_spy": 3, "cost": 0.03926}, {"ts": "2026-10-10T00:58:34+00:00", "kind": "review", "strategy": "C", "lessons": "No trades this week. The -0.01% came from AI cost alone, and SPY gained +0.68%. The only real setup was the T/VZ selloff on SpaceX fears (-8\u20139%), which fit rule 1. The trader dismissed it with \"no edge\" and never weighed whether the fear was long-dated or immediate. I don't know how T/VZ moved afterward, so I won't call it a missed win. The fix is a required three-step verdict for each candidate, not a looser bar for buying. I left the confidence rules alone: there are only 5 tournament trades, and buys at every confidence level averaged slightly positive.", "self_assessment": "Flat in cash (-0.01%) while SPY gained +0.68%; skipped the one real setup (T/VZ) without checking it, so every candidate now needs a written verdict.", "confidence_beat_spy": 3, "cost": 0.03636}, {"ts": "2026-10-10T00:58:50+00:00", "kind": "review", "strategy": "D", "lessons": "For the second week in a row there were no trades, and we trailed SPY by about 0.7pp just by sitting in cash. The trader dismissed the whole mover list as junk and never searched past it, even though the notes already said to. I made the screen stricter: every hold must name specific liquid candidates and why each failed. I also set a deadline of one position by the second session, plus a small-cap ETF fallback if allowed. There's still no confidence data of our own to calibrate on.", "self_assessment": "No trades again, -0.01% vs SPY +0.68%. Too much caution let the week go to waste; the notes now require a deeper screen and a fallback position.", "confidence_beat_spy": 3, "cost": 0.03868}, {"ts": "2026-10-10T00:59:03+00:00", "kind": "review", "strategy": "E", "lessons": "We lost to SPY because we sat mostly in cash, not because of bad picks. META filled, but MSFT expired twice because the trader bid below the market, which broke the notes' own rule, and the cash sweep never happened. The notes now make the sweep mandatory at the same check-in, ban under-bids, and drop a name after two expiries. Confidence data is too thin to mean anything, so it only sets size.", "self_assessment": "-0.05% vs SPY +0.68%: about 68% sat in cash after MSFT under-bids expired twice. Next week: fill orders and sweep the cash into QQQ.", "confidence_beat_spy": 4, "cost": 0.03837}], "spend": {"2026-10": {"by_strategy": {"A": 0.09066, "B": 0.09367, "C": 0.098814, "D": 0.088378, "E": 0.15196}, "calls": 26, "total": 0.523482}}, "budget": {"target": 5.0, "cap": 20.0}, "notes": {"A": "# Strategy A notes: Momentum\n\n## Entry rules\n- Buy names with positive 20-day AND 60-day returns that trade above their 50-day average.\n- Rank by 60-day trend first, then 20-day. Keep doing this; PLTR, the 60d leader, was the core pick.\n- Don't chase a single-day spike of more than 5%.\n- A name more than 15% above its 50d average is extended. Give it the smallest position or skip it.\n\n## Sizing\n- Hold 2-4 positions. Three positions with about $20 in cash worked well.\n- Keep $15-25 in cash so a rotation can happen without selling first.\n- Use confidence 5-6 for ordinary setups. Use 7+ only for a name that leads on both 20d and 60d, is not extended and has no spike. Confidence hasn't predicted results yet (tournament: 1-4 avg +0.17%, 5-7 avg +0.13%, n=5), so don't raise it without a clear reason.\n\n## Exits and rotation\n- Rotate out when a holding closes below its 50d average, or when its 20d return turns negative and it falls out of the top momentum names.\n- Hold a position at least 3 trading days unless it breaks its 50d average.\n- Spread costs ($0.92, about 0.18% of capital) are bigger than the gap to SPY. Avoid churning and make at most one rotation per day, only for a clearly higher-ranked replacement.\n- Don't take profits just because a position is up. Momentum needs time to run.\n\n## Execution\n- Place limit buys near the current ask. Fills have come within about 0.3% of the limit.\n- META filled at 722.34 against a 720 buy limit, which is a limit violation. Check every fill against its limit and log any repeat.\n\n## Status\n- Week: +1.35% vs SPY +0.68%. Since start: +0.33% vs SPY +0.41%, still slightly behind.\n- Holding PLTR (core), META, AMD. AMD is the most extended, so cut it first if it weakens (closes below its 50d average or its 20d return turns negative). Otherwise let all three run; next week should mostly be holds.\n", "B": "# Strategy B notes: Mean reversion\n\n## Entry setup (core, unchanged)\n- Look for liquid names with a sharp 5-day drop that is large for their volatility (about 2x their normal 5-day move or more), while the 60-day trend is still intact and price is near or above its 50d MA.\n- Skip drops caused by clear bad news: earnings misses, guidance cuts, or sector-wide regulatory or pricing shocks (e.g. VZ/T -8% in one day on 10/09).\n- An unexplained drop is not an automatic skip. Check for news first. If none turns up and the trend is intact, take a small position instead of deferring again (INTC was passed over twice without a news check).\n\n## Sizing and cash\n- Holding one ~$72 position with the rest in cash lags SPY in up weeks (+0.14% vs +0.68%). Target 2-4 positions in uncorrelated dips (different sectors) when setups exist, with about 40-60% of the account invested.\n- If no setup qualifies, cash is fine. Don't force trades that break the entry rules.\n- Spread costs are heavy ($1.96 so far, about 0.4% of the account). Prefer large, tight-spread names. Make each position big enough that the spread is a small share of it, and don't trade in and out.\n\n## Orders\n- Place limits close to the current price.\n- Check every fill against its limit. The CRM buy (limit 222.5) filled at 228.72, which is above the limit and should be impossible. Treat it as an execution or data anomaly, and mention any repeat in the decision reasoning.\n\n## Exits (CRM: fill 228.72, entered 10/08)\n- Take profit when the price gets back to about the pre-drop level (roughly +5%, ~240 for CRM).\n- Cut at about -5% from the fill price (~217 for CRM), or right away if bad news comes out.\n- Time stop: no bounce within about 10 trading days (CRM by ~10/22) means exit and recycle the cash.\n\n## Confidence\n- Tournament data so far: conf 1-4 averaged +0.17% (1 buy) and conf 5-7 averaged +0.13% (4 buys). That's too few trades to show any calibration. Keep confidence honest, use the middle of the range for textbook setups, and don't inflate it to get bigger size.\n", "C": "# Strategy C notes: Catalyst reader\n\n## Identity\nTrade only when a specific headline explains a price move, or explains why a stock didn't move. Look for over- and under-reactions. Holding cash is allowed, but it has lagged SPY so far. Too much caution is a cost too.\n\n## Entry rules\n- Each session, name the single best catalyst setup, even if you end up holding. It counts as a candidate if either of these applies:\n  1. **Possible overreaction:** a large move (>5%) on news that is speculative, long-dated, or a narrative, e.g. \"competitor might disrupt in years\". Consider a small buy once the selling slows, e.g. the stock holds above its intraday low or bounces on day 2.\n  2. **Possible underreaction:** concrete, material news (earnings beat, guidance raise, contract, approval) with less than a 1% move.\n- Every candidate needs a written verdict: (a) what the news actually changes in the next 12 months, (b) whether the move is bigger than that, (c) buy, or hold with a specific reason. \"I don't have an edge\" or \"the narrative could keep pushing\" is not a verdict on its own.\n- Don't buy into a fresh structural downtrend (regulatory change, guidance cut). Real fundamental damage is not an overreaction.\n\n## Data hygiene\n- If every price shows 0.0%, treat the data as stale. Hold, and say so. Re-check at the next session.\n\n## Sizing and confidence\n- Starter positions: confidence 5\u20136, small size. Add only after confirmation, such as a day-2 hold or a bounce.\n- Tournament data so far: confidence 1\u20134 avg +0.17% (n=1), 5\u20137 avg +0.13% (n=4), no 8+ trades. That's too few trades to calibrate, so don't use 8+ yet.\n- Hold at most 2 catalyst positions.\n\n## Exits\n- Exit within 1\u20133 days, or once about half the overreaction has been retraced.\n- Exit right away if follow-up news shows the move was justified.\n\n## Log\n- Week 1: 0 trades, -0.01% (AI cost only) vs SPY +0.68%. Skipped the T/VZ SpaceX-fear selloff (-8\u20139%) without a proper rule-1 verdict. Its outcome isn't known, so don't treat it as a proven miss. The mistake was skipping the check, not necessarily the hold.\n", "D": "# Strategy D notes: Small-cap explorer\n\nIdentity: find tradable small-cap opportunities that SPY doesn't capture. Record so far: zero trades, -0.01% since start vs SPY +0.41%. Holding cash loses to SPY whenever the market rises. Two weeks of \"no edge, hold\" is the failure mode to fix now.\n\n## Screening (required before any \"hold\")\n- Drop warrants (W/WS), units (U), rights (R) and anything under ~$0.50 straight away. Don't comment on them.\n- The top-% mover list is only a starting point. Most of it is junk. Go further down to names moving \u00b13\u201315% with real volume (a 1%-of-volume cap still covers our size) and spreads \u22641.5%.\n- Every hold decision must name the top 2\u20133 liquid candidates and give the specific reason each one failed. \"Movers are junk\" is not a reason to hold.\n- Prefer: day-2 follow-through after a catalyst (earnings, FDA, contract), pullbacks to support after a clean move, and sector moves where several small caps rise together.\n- Avoid one-day spikes of +30% or more (skipping VEEA at +51% was fine).\n\n## Entry and sizing\n- If a liquid name passes the screen with a plausible move of 3\u20135x its spread, buy a small starter (confidence 5\u20136). A starter doesn't need certainty. It needs a defined thesis and a defined exit.\n- Target: at least one position open by the end of the second session each week. Max 2\u20133 names.\n- Fallback: if by the second session no single name qualifies and a small-cap ETF (e.g., IWM) is allowed, hold a modest position in it (confidence 5) instead of all cash. Swap it out when a real setup appears.\n- Use limit orders at or near the mid. Don't chase unfilled orders.\n\n## Exits\n- Set the exit before buying: take profit at about 2\u20133x the expected move, and cut when the thesis breaks (catalyst fades, price falls back below the breakout level).\n- Don't hold through binary events unless the event is the thesis.\n\n## Confidence\n- Still no data from our own trades. Tournament-wide, buys at confidence 1\u20137 have been slightly positive (n=5). Use 5\u20136 as the default. Save 8+ for setups with a catalyst, good liquidity and a clean chart.\n", "E": "# Strategy E: Claude's pick: Large-cap momentum, fully invested, low turnover\n\n## Approach\nHold 3-4 liquid large-cap momentum leaders plus a QQQ/XLK core. To beat SPY the money has to be invested. Cash is the biggest risk to this strategy: last week about 68% sat idle and we trailed SPY by 0.7%.\n\n## Universe\n- US stocks over $10B market cap with average daily volume over $50M, or liquid ETFs (QQQ, XLK, SMH, XLF, XLI).\n- Skip anything up more than 15% in 3 days.\n\n## Entry\n- Price above the 50-day average, and the 50-day above the 200-day.\n- **Limits: last price to +0.3% above. Never bid below the last price.** The MSFT order expired twice because of under-bids. After one expiry, re-place at last +0.3%. After two expiries, drop the name and use the sweep ETF.\n- Don't wait for pullbacks. Buy at the first check-in that the rules allow.\n- Don't open a position within 2 days of earnings.\n- If SPY is below its 50-day average or there's a broad selloff, hold at most 2 stocks, but keep the sweep ETF.\n\n## Sizing\n- Confidence 8 or higher: 25-33%. Confidence 6-7: about two-thirds of a slot (about 20%). Confidence 5 or lower: skip.\n- **Mandatory cash sweep, same check-in:** any cash above 10% after the stock orders goes into QQQ (or XLK) with a limit at last +0.2%. Sell the sweep to fund new leaders.\n- No more than 2 single stocks per sector (the ETF doesn't count).\n- Confidence is not yet predictive (tournament: 1-4 avg +0.17%, 5-7 avg +0.13%, small sample). Use it only for sizing, not as a reason to wait.\n\n## Exits\n- Sell if a position closes 8% below entry or below its 50-day average.\n- Rotate only if a name falls off the leaders list and a clearly stronger name exists. At most 1 rotation per slot per week.\n- Trim half if a position is up 20% or more within 2 weeks.\n- Ignore single red days and headlines that don't change the fundamentals.\n\n## Habits\n- Holdings: META (about 32%). **First check-in this week:** buy one more leader (MSFT if it qualifies, otherwise another non-Communications leader) at about 20%, then sweep the rest into QQQ so cash ends at 10% or less.\n- After that: do nothing unless an exit fires. 2-6 trades per week.\n- Log a confidence score and a one-line reason for every trade.\n"}};
