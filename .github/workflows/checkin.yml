name: Check-in

# Fires every 15 minutes during market hours (UTC, covering daylight and standard time).
# GitHub's scheduler is best-effort and sometimes drops or delays runs, so the script itself
# decides which Eastern-time slot is due, catches up a missed slot, and ignores duplicates.
# Runs with nothing due exit in seconds and commit nothing.
on:
  schedule:
    - cron: "7,22,37,52 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run every strategy now, ignoring slots"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trading-state   # never two runs editing the ledger at once
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check-in
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot.checkin ${{ inputs.force && '--force' || '' }}
      - name: Save state
        run: |
          git config user.name "tournament-bot"
          git config user.email "tournament-bot@users.noreply.github.com"
          git add state notes docs
          git diff --cached --quiet || git commit -m "Check-in $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase && git push

